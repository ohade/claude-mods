# Phase-A gate: freeze runtime dependencies while small cohesive modules are extracted.
# Declaration and Python/process edges still require native/consumer checks.
[archview]
language = "typescript"
tsconfig = "architecture/tsconfig.json"
type_checking_imports = "include"
externals_undeclared = "error"
fail_on_violations = true
fail_on_cycles = true
baseline = "archview-baseline.json"

[archview.allowed]
"answer-blocks.ts" = []
"banner-layout.ts" = ["terminal-text.ts"]
"blob-store.ts" = []
"build-identity.ts" = []
"checkpoint.ts" = ["steps.ts"]
"deploy-drift.ts" = []
"diagnose-bundle.ts" = ["ledger-text.ts"]
"diagnose-flow.ts" = ["diagnose-bundle.ts", "identity-read.ts", "steps.ts"]
"identity-read.ts" = []
"ledger-policy.ts" = []
"ledger-text.ts" = []
"pane-layout.ts" = ["pane-order.ts"]
"pane-order.ts" = ["steps.ts"]
"reconcile.ts" = ["checkpoint.ts"]
"register.tsx" = ["answer-blocks.ts", "banner-layout.ts", "blob-store.ts", "build-identity.ts", "checkpoint.ts", "deploy-drift.ts", "diagnose-bundle.ts", "diagnose-flow.ts", "identity-read.ts", "ledger-policy.ts", "ledger-text.ts", "pane-layout.ts", "pane-order.ts", "reconcile.ts", "retention.ts", "size-index.ts", "steps.ts", "stored-codecs.ts", "terminal-text.ts", "transcript-baseline.ts", "turn-policy.ts"]
"retention.ts" = ["checkpoint.ts", "size-index.ts"]
"size-index.ts" = ["retention.ts"]
"steps.ts" = []
"stored-codecs.ts" = ["ledger-policy.ts", "ledger-text.ts", "reconcile.ts"]
"terminal-text.ts" = []
"transcript-baseline.ts" = []
"turn-policy.ts" = ["ledger-policy.ts", "ledger-text.ts", "steps.ts"]

[archview.externals]
"answer-blocks.ts" = []
"banner-layout.ts" = []
"blob-store.ts" = []
"build-identity.ts" = []
"checkpoint.ts" = []
"deploy-drift.ts" = []
"diagnose-bundle.ts" = []
"diagnose-flow.ts" = []
"identity-read.ts" = []
"ledger-policy.ts" = []
"ledger-text.ts" = []
"pane-layout.ts" = []
"pane-order.ts" = []
"reconcile.ts" = []
"register.tsx" = []
"retention.ts" = []
"size-index.ts" = []
"steps.ts" = []
"stored-codecs.ts" = []
"terminal-text.ts" = []
"transcript-baseline.ts" = []
"turn-policy.ts" = []

[[archview.forbidden]]
from = "*"
to = "register.tsx"

[[archview.forbidden]]
from = "size-index.ts"
to = "retention.ts"

[[archview.exceptions]]
importer = "track-checks/size-index.ts"
imported = "track-checks/retention.ts"
kind = "type_only"
reason = "Existing RetentionStore type within capacity; a value import would create a runtime cycle."
