# Phase-A gate: freeze runtime dependencies while small cohesive modules are extracted.
# Declaration and Python/process edges still require native/consumer checks.
[archview]
language = "typescript"
tsconfig = "architecture/tsconfig.json"
type_checking_imports = "include"
externals_undeclared = "error"
fail_on_violations = true
fail_on_cycles = true
baseline = "archview-baseline.json"

[archview.allowed]
"answer-blocks.ts" = []
"banner-layout.ts" = ["terminal-text.ts"]
"blob-store.ts" = []
"build-identity.ts" = []
"cancel-policy.ts" = []
"checkpoint.ts" = ["steps.ts"]
"deploy-drift.ts" = []
"diagnose-bundle.ts" = ["ledger-text.ts"]
"diagnose-flow.ts" = ["diagnose-bundle.ts", "identity-read.ts", "steps.ts"]
"identity-read.ts" = []
"ledger-policy.ts" = []
"ledger-text.ts" = []
"pane-elements.ts" = []
"pane-layout.ts" = ["pane-order.ts"]
"pane-order.ts" = ["steps.ts"]
"pane-step-view.tsx" = ["pane-elements.ts", "work-appearance.ts"]
"reconcile.ts" = ["checkpoint.ts"]
"register.tsx" = ["answer-blocks.ts", "banner-layout.ts", "blob-store.ts", "build-identity.ts", "cancel-policy.ts", "checkpoint.ts", "deploy-drift.ts", "diagnose-bundle.ts", "diagnose-flow.ts", "identity-read.ts", "ledger-policy.ts", "ledger-text.ts", "pane-layout.ts", "pane-order.ts", "pane-step-view.tsx", "reconcile.ts", "restore-proposal.ts", "restore-records.ts", "restore-source.ts", "retention.ts", "size-index.ts", "steps.ts", "stored-codecs.ts", "task-ownership.ts", "terminal-text.ts", "transcript-baseline.ts", "turn-policy.ts", "work-appearance.ts"]
"restore-proposal.ts" = ["ledger-policy.ts", "reconcile.ts", "restore-records.ts"]
"restore-records.ts" = ["reconcile.ts"]
"restore-source.ts" = ["ledger-policy.ts", "stored-codecs.ts"]
"retention-capacity.ts" = ["retention-eviction.ts", "retention-expiry.ts", "retention-records.ts", "size-index.ts"]
"retention-cleanup.ts" = ["retention-capacity.ts", "retention-eviction.ts", "retention-expiry.ts", "retention-journal.ts", "retention-records.ts"]
"retention-eviction.ts" = ["retention-expiry.ts", "retention-records.ts"]
"retention-expiry.ts" = ["checkpoint.ts", "retention-records.ts", "size-index.ts"]
"retention-journal.ts" = ["checkpoint.ts", "retention-capacity.ts", "retention-expiry.ts", "retention-records.ts", "size-index.ts"]
"retention-records.ts" = []
"retention.ts" = ["retention-capacity.ts", "retention-cleanup.ts", "retention-eviction.ts", "retention-journal.ts", "retention-records.ts"]
"size-index.ts" = ["retention-records.ts"]
"steps.ts" = []
"stored-codecs.ts" = ["ledger-policy.ts", "ledger-text.ts", "reconcile.ts"]
"task-ownership.ts" = ["ledger-text.ts"]
"terminal-text.ts" = []
"transcript-baseline.ts" = []
"turn-policy.ts" = ["ledger-policy.ts", "ledger-text.ts", "steps.ts"]
"work-appearance.ts" = ["steps.ts"]

